<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420">
  <style>
    text,tspan{font-family:'Consolas','Courier New',monospace;user-select:none}
    @keyframes blink{0%,46%{opacity:1}50%,100%{opacity:0}}
    @keyframes hand{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes radar{from{opacity:.85;r:2}to{opacity:0;r:30}}
    @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes wifiWave{0%,100%{opacity:.15}50%{opacity:.9}}
    @keyframes alertFade{0%,30%{opacity:1}70%,100%{opacity:.25}}
    .cursor{animation:blink 1s steps(1,end) infinite}
    .hand{animation:hand .32s ease-in-out infinite}
    .hand2{animation:hand .32s ease-in-out .16s infinite}
    .radar{fill:none;stroke:#00ff41;stroke-width:1;animation:radar 1.8s linear infinite}
    .dotLive{animation:pulseDot 1.4s ease-in-out infinite}
    .wifi{animation:wifiWave 2.2s ease-in-out infinite}
    .alertAni{animation:alertFade 3.4s ease-in-out infinite}
  </style>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>


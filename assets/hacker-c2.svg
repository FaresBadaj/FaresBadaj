<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360">
  <style>
    text{font-family:Consolas,'Courier New',monospace;user-select:none}
    @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
    @keyframes hand{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes radar{from{opacity:.9;r:1}to{opacity:0;r:24}}
    @keyframes matrixFall{0%{transform:translateY(-24px);opacity:0}15%{opacity:1}100%{transform:translateY(120px);opacity:0}}
    .cursor{animation:blink 1s steps(1,end) infinite}
    .hand{animation:hand .35s ease-in-out infinite}
    .hand2{animation:hand .35s ease-in-out .18s infinite}
    .bob{animation:bob 2.4s ease-in-out infinite}
    .radar{fill:none;stroke:#00ff41;stroke-width:1;animation:radar 1.6s linear infinite}
    .mchar{fill:#00ff41;font-size:8px;animation:matrixFall 2.4s linear infinite;opacity:0}
  </style>
  <defs>
    <clipPath id="m3"><rect x="428" y="123" width="134" height="89" rx="4"/></clipPath>
  </defs>

  <rect width="960" height="360" fill="#0d1117"/>
  <line x1="0" y1="2" x2="960" y2="2" stroke="#00ff41" stroke-opacity=".28" stroke-width="2"/>
  <g stroke="#00ff41" stroke-opacity=".06" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="90"/><line x1="160" y1="0" x2="160" y2="90"/>
    <line x1="240" y1="0" x2="240" y2="90"/><line x1="320" y1="0" x2="320" y2="90"/>
    <line x1="0" y1="45" x2="580" y2="45"/>
  </g>

  <rect x="140" y="335" width="680" height="3" rx="1.5" fill="#00ff41" fill-opacity=".12"/>

  <!-- desk -->
  <rect x="60" y="250" width="640" height="14" rx="6" fill="#161b22"/>
  <rect x="90" y="264" width="10" height="96" fill="#12161d"/>
  <rect x="640" y="264" width="10" height="96" fill="#12161d"/>

  <!-- monitor 1 : ADAPTIX listeners -->
  <rect x="80" y="115" width="150" height="105" rx="8" fill="#1c2129"/>
  <rect x="142" y="220" width="26" height="30" fill="#1c2129"/>
  <rect x="88" y="123" width="134" height="89" rx="4" fill="#07070c"/>
  <rect x="88" y="123" width="134" height="11" rx="4" fill="#101015"/>
  <text x="95" y="132" fill="#00ff41" font-size="8" font-weight="bold">LISTENERS</text>
  <circle cx="150" cy="160" class="radar"/>
  <circle cx="150" cy="160" class="radar" style="animation-delay:.55s"/>
  <circle cx="150" cy="160" class="radar" style="animation-delay:1.1s"/>
  <circle cx="150" cy="160" r="2" fill="#00ff41"/>
  <text x="96" y="180" fill="#00ff41" font-size="8">https  :443  ●</text>
  <text x="96" y="191" fill="#00ff41" font-size="8">smb    :445  ●</text>
  <text x="96" y="202" fill="#ffd166" font-size="8">tcp :9001  ◦</text>
  <text x="202" y="132" fill="#ff4d4d" font-size="7" class="cursor">▌</text>

  <!-- monitor 2 : ADAPTIX GUI client -->
  <rect x="250" y="115" width="150" height="105" rx="8" fill="#1c2129"/>
  <rect x="312" y="220" width="26" height="30" fill="#1c2129"/>
  <rect x="258" y="123" width="134" height="89" rx="4" fill="#07070c"/>
  <rect x="258" y="123" width="134" height="12" rx="4" fill="#101015"/>
  <text x="264" y="132" fill="#00ff41" font-size="8" font-weight="bold">■ ADAPTIX C2</text>
  <text x="356" y="132" fill="#555b68" font-size="7">v1.3</text>
  <g fill="#00c8ff" font-size="7">
    <text x="264" y="146">[agents]</text>
    <text x="322" y="146" fill="#fa8072">[listener]</text>
    <text x="382" y="146" fill="#00c8ff">[tgt]</text>
  </g>
  <g font-size="8">
    <text x="264" y="160" fill="#565c69">id host    os</text>
    <text x="264" y="171" fill="#00ff41">1  dc01  win10</text>
    <text x="264" y="182" fill="#00ff41">2  ws02  win11</text>
    <text x="264" y="193" fill="#00ffe7">3  web1  linux</text>
  </g>
  <circle cx="327" cy="187" r="2" fill="#00ff41"/>
  <text x="264" y="206" fill="#00c8ff" font-size="8">adaptix&gt; beacon </text>
  <text x="346" y="206" fill="#00ff41" font-size="8" class="cursor">▉</text>

  <!-- monitor 3 : targets / creds -->
  <rect x="420" y="115" width="150" height="105" rx="8" fill="#1c2129"/>
  <rect x="482" y="220" width="26" height="30" fill="#1c2129"/>
  <rect x="428" y="123" width="134" height="89" rx="4" fill="#07070c"/>
  <rect x="428" y="123" width="134" height="11" rx="4" fill="#101015"/>
  <text x="435" y="132" fill="#ffd166" font-size="8" font-weight="bold">TARGETS / CREDS</text>
  <g clip-path="url(#m3)">
    <g class="mchar">
      <text x="436" y="56">0</text><text x="452" y="56" style="animation-delay:.3s">1</text>
      <text x="468" y="56">▓</text><text x="484" y="56" style="animation-delay:.6s">░</text>
      <text x="500" y="56">0</text><text x="516" y="56" style="animation-delay:.9s">1</text>
      <text x="532" y="56">▓</text><text x="548" y="56" style="animation-delay:1.2s">0</text>
    </g>
  </g>
  <g font-size="8">
    <text x="436" y="150" fill="#00ff41">10.0.0.5   win</text>
    <text x="436" y="160" fill="#00ff41">10.0.0.12  win</text>
    <text x="436" y="170" fill="#00ffe7">10.0.0.9   lnx</text>
    <text x="436" y="185" fill="#ffd166">svc$ :: P@ssw0rd</text>
    <text x="436" y="195" fill="#ffd166">adm  :: Pr0jectX</text>
  </g>
  <ellipse cx="505" cy="158" rx="10" ry="13" fill="#e6e6e6" opacity=".92"/>
  <path d="M495 152 q10 -12 20 0 l0 6 q-10 -6 -20 0 Z" fill="#111"/>
  <ellipse cx="505" cy="163" rx="6" ry="7" fill="#fff"/>
  <polygon points="496,154 489,156 496,159" fill="#f90"/>
  <circle cx="500" cy="153" r="1" fill="#111"/><circle cx="510" cy="153" r="1" fill="#111"/>
  <text x="436" y="132" fill="#00c8ff" font-size="8" class="cursor">▍</text>

  <!-- chair -->
  <rect x="772" y="118" width="14" height="124" rx="6" fill="#1b2027"/>
  <rect x="700" y="242" width="100" height="12" rx="4" fill="#1b2027"/>
  <rect x="714" y="254" width="8" height="106" fill="#14181f"/>
  <rect x="788" y="254" width="8" height="106" fill="#14181f"/>

  <!-- hoodie -->
  <rect x="645" y="168" width="115" height="84" rx="22" fill="#0f3d24"/>
  <rect x="660" y="180" width="6" height="70" rx="3" fill="#0a2c1a"/>
  <line x1="698" y1="182" x2="698" y2="248" stroke="#0a2c1a" stroke-width="2"/>
  <text x="710" y="214" fill="#00ff41" font-size="9" transform="rotate(-90 710 214)">adaptix&gt;</text>

  <!-- person (bobbing head) -->
  <g class="bob">
    <circle cx="700" cy="128" r="46" fill="#0f3d24"/>
    <circle cx="700" cy="130" r="38" fill="#f2c48d"/>
    <circle cx="676" cy="126" r="3" fill="#111"/>
    <path d="M664 142 q9 8 18 0" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M726 128 q4 -8 10 -8 q6 0 12 8" stroke="#b9d8f0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M662 116 a44 44 0 0 1 76 0" stroke="#c8102e" stroke-width="6" fill="none"/>
    <rect x="653" y="116" width="11" height="24" rx="5" fill="#c8102e"/>
    <rect x="736" y="116" width="11" height="24" rx="5" fill="#c8102e"/>
  </g>

  <!-- typing arm + hands on keyboard -->
  <path d="M656 200 q-46 8 -62 36" stroke="#0f3d24" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M690 200 q10 14 6 34" stroke="#0f3d24" stroke-width="16" stroke-linecap="round" fill="none"/>
  <rect x="556" y="242" width="92" height="12" rx="3" fill="#262c36"/>
  <g stroke="#3a4356" stroke-width="1.4">
    <line x1="566" y1="246" x2="640" y2="246"/><line x1="566" y1="250" x2="640" y2="250"/>
  </g>
  <ellipse class="hand" cx="598" cy="236" rx="10" ry="7" fill="#f2c48d"/>
  <ellipse class="hand2" cx="646" cy="236" rx="10" ry="7" fill="#f2c48d"/>

  <!-- floating fx -->
  <text x="630" y="86" class="cursor" fill="#00ff41" font-size="11" style="animation-delay:.2s">$</text>
  <text x="616" y="104" class="cursor" fill="#00c8ff" font-size="10" style="animation-delay:1.1s">&lt;/&gt;</text>
  <text x="764" y="92" class="cursor" fill="#00ff41" font-size="10" style="animation-delay:.6s">{ }</text>
  <text x="786" y="104" class="cursor" fill="#00c8ff" font-size="9" style="animation-delay:1.5s">0x1F</text>
</svg>